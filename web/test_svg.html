<!DOCTYPE html>
<html>
<head><style>body { margin:0; background:#ebdcb8; display:flex; justify-content:center; align-items:center; height:100vh; }</style></head>
<body>
<canvas id='c' width='800' height='600'></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.fillStyle = '#ebdcb8';
ctx.fillRect(0, 0, 800, 600);

const cx = 400, cy = 340, r = 90;

// Avatar
const av = new Image();
av.onload = () => {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(av, cx - r, cy - r, r * 2, r * 2);
  ctx.restore();

  // Top line with corner ticks
  const w = 560;
  const x = cx - w/2;
  const y = cy - r - 70;
  ctx.strokeStyle = '#1c1917';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, y + 16);
  ctx.lineTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + 16);
  ctx.stroke();

  const svgImg = new Image();
  svgImg.onload = () => {
    // Draw SVG centered over avatar
    // In SVG, circle is at cx=250, cy=210, r=98. Size is 500x380
    const scale = r / 98;
    const sw = 500 * scale;
    const sh = 380 * scale;
    ctx.drawImage(svgImg, cx - 250 * scale, cy - 210 * scale, sw, sh);
  };
  svgImg.src = '/assets/vip_crown_top1.svg';
};
av.src = '/avatars/top1_man.jpg';
</script>
</body>
</html>
